[project]
name = "contx"
version = "0.0.1"
description = "Local-first personal context memory for AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.139,<0.140",
    "pydantic>=2.11,<3",
    "pyobjc-framework-ApplicationServices>=12.2,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=12.2,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12.2,<13; sys_platform == 'darwin'",
    "sqlalchemy>=2.0,<3",
    "typer>=0.16,<1",
    "uvicorn>=0.51,<0.52",
]

[project.scripts]
contx = "contx.cli.app:main"
contx-collector = "contx.daemon.entrypoint:main"
contx-native-control = "contx.macos_app.control:main"
contx-processor = "contx.processing.entrypoint:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "contx"
module-root = ""

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["contx"]

[tool.coverage.run]
branch = true
source = ["contx"]
